name: Windows Release Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build-windows\vcpkg-cache
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Validate release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_SIGN_CERT_BASE64 -or -not $env:WINDOWS_SIGN_CERT_PASSWORD) {
            throw "A v* release tag requires WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD secrets. Use Run workflow on a branch for an unsigned installer."
          }

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport qtwebsockets"
          cache: true
          cache-key-prefix: windows-qt-complete-v2

      - name: Locate Qt and Inno Setup
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $qtRoot = Split-Path -Parent (Split-Path -Parent $qmake)
          "QTDIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $innoVersion = if (Test-Path -LiteralPath $iscc) {
            (Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion
          } else { "" }
          if (-not $innoVersion.StartsWith("6.7.1")) {
            choco upgrade innosetup --version=6.7.1 --allow-downgrade `
              --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }

      - name: Build, test, deploy and package
        shell: pwsh
        run: |
          $signingArguments = @{}
          $requireSignature = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          if ($env:WINDOWS_SIGN_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "vltone-signing.pfx"
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
            $signingArguments.SignPfxPath = $pfx
          } elseif ($requireSignature) {
            throw "A v* release tag requires WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD secrets."
          }

          try {
            & .\packaging\windows\build.ps1 `
              -QtRoot $env:QTDIR `
              -RequireSignature:$requireSignature `
              @signingArguments
          } finally {
            if ($signingArguments.ContainsKey("SignPfxPath")) {
              Remove-Item -LiteralPath $signingArguments.SignPfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload CTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: |
            build-windows/Testing/Temporary/**
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

      - name: Preserve dependency cache after a build failure
        if: failure() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Upload private build-ID symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VLTONE-${{ github.sha }}-windows-symbols
          path: build-windows/**/*.pdb
          if-no-files-found: warn

      - name: Publish Windows artifacts
        id: windows-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VLTONE-${{ github.sha }}-windows-x64
          path: |
            build-windows/artifacts/VLTONE-*-windows-x64.zip
            build-windows/artifacts/VLTONE-*-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show installer download
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.windows-artifacts.outputs.artifact-url }}
        run: |
          $installer = Get-Item build-windows/artifacts/VLTONE-*-x64-Setup.exe -ErrorAction Stop
          @"
          ## Windows x64 installer

          [Download the Windows build]($env:ARTIFACT_URL), extract the archive and run **$($installer.Name)** on Windows.

          The archive also contains the portable application ZIP. Build artifacts are retained for 30 days.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
