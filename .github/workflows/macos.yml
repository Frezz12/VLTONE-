name: macOS Desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Xcode 16's libc++ does not provide std::jthread/stop_token.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install cmake ninja qt qtmultimedia qtwebengine qtserialport qtwebsockets portaudio rtmidi libsndfile nlohmann-json

      - name: Configure Release desktop
        run: >-
          cmake --preset macos
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DDAW_ENABLE_COLLABORATION=ON
          -DDAW_ENFORCE_COLLABORATION_RELEASE_GATES=ON

      - name: Build DAW, reporter and tests
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run deterministic offscreen self-test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          # Offscreen has no hardware scene; GPU behavior has separate tests.
          VLT_GPU_WORKSPACE: "0"
        run: build/bin/VLTONE --selftest

      - name: Preserve private build-ID symbols
        if: always()
        run: |
          mkdir -p build/symbols
          dsymutil build/bin/VLTONE -o build/symbols/VLTONE.dSYM
          dsymutil build/bin/daw_reporter -o build/symbols/daw_reporter.dSYM

      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VLTONE-${{ github.sha }}-macos-symbols
          path: build/symbols/**
          if-no-files-found: error
