name: Backend and Web Platform

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VLT_TEST_DATABASE_URL: postgres://vlt_test:vlt_test@127.0.0.1:5432/vlt_test?sslmode=disable
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 without Docker
        shell: bash
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-18
          sudo systemctl start postgresql
          sudo -u postgres psql --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE USER vlt_test WITH PASSWORD 'vlt_test';
          CREATE DATABASE vlt_test OWNER vlt_test;
          SQL
          psql "$VLT_TEST_DATABASE_URL" -c 'SELECT version();'

      - name: Install Go 1.26.7
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          cache-dependency-path: backend/go.sum

      - name: Test backend and migration directions
        working-directory: backend
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Install pnpm 11.3.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API and public-release gate
        run: |
          pnpm generate:api
          git diff --exit-code -- packages/api-client/src/schema.d.ts
          pnpm check:release-security

      - name: Typecheck and build independent Next.js apps
        run: |
          pnpm typecheck
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @vlt/web exec playwright install --with-deps chromium

      - name: Run public-site and admin E2E
        run: |
          pnpm --filter @vlt/web test
          pnpm --filter @vlt/admin test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-playwright-${{ github.sha }}
          path: |
            web/test-results/**
            admin/test-results/**
          if-no-files-found: ignore
