openapi: 3.1.0
info:
  title: VLT Studio Platform API
  version: 0.0.1
  description: Source-of-truth contract shared by the public site, admin site, and desktop application.
servers:
  - url: http://localhost:8080
paths:
  /v1/meta:
    get:
      operationId: getMeta
      responses:
        "200": { description: Service metadata, content: { application/json: { schema: { $ref: "#/components/schemas/Meta" } } } }
  /v1/releases:
    get:
      operationId: listReleases
      parameters: [{ $ref: "#/components/parameters/Locale" }]
      responses:
        "200":
          description: Published releases ordered by semantic version
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties: { releases: { type: array, items: { $ref: "#/components/schemas/PublicRelease" } } }
  /v1/releases/latest:
    get:
      operationId: getLatestRelease
      parameters: [{ $ref: "#/components/parameters/Platform" }, { $ref: "#/components/parameters/Locale" }]
      responses:
        "200": { description: Latest release with an installer for the requested platform, content: { application/json: { schema: { $ref: "#/components/schemas/LatestRelease" } } } }
        "204": { description: No published release supports this platform }
  /v1/releases/{version}:
    get:
      operationId: getRelease
      parameters: [{ $ref: "#/components/parameters/ReleaseVersion" }, { $ref: "#/components/parameters/Locale" }]
      responses:
        "200": { description: Localized published release, content: { application/json: { schema: { $ref: "#/components/schemas/PublicRelease" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/releases/{version}/download/{kind}:
    get:
      operationId: downloadReleaseArtifact
      parameters: [{ $ref: "#/components/parameters/ReleaseVersion" }, { $ref: "#/components/parameters/ArtifactKind" }]
      responses:
        "200": { description: Installer with Range, ETag and SHA-256 headers, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/releases/{version}/screenshots/{screenshotId}:
    get:
      operationId: getReleaseScreenshot
      parameters: [{ $ref: "#/components/parameters/ReleaseVersion" }, { $ref: "#/components/parameters/ScreenshotId" }]
      responses:
        "200": { description: Sanitized release screenshot, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/web/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/AccountSession" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/web/auth/login:
    post:
      operationId: webLogin
      requestBody: { $ref: "#/components/requestBodies/Login" }
      responses:
        "200": { $ref: "#/components/responses/AccountSession" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/web/auth/logout:
    post:
      operationId: webLogout
      security: [{ webCookie: [], csrf: [] }]
      responses: { "204": { description: Signed out }, "403": { $ref: "#/components/responses/Error" } }
  /v1/web/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses: { "202": { description: Accepted regardless of account existence } }
  /v1/web/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetConfirmRequest" } } }
      responses: { "204": { description: Password changed and sessions revoked }, "400": { $ref: "#/components/responses/Error" } }
  /v1/me:
    get:
      operationId: getMe
      security: [{ webCookie: [] }]
      responses: { "200": { $ref: "#/components/responses/AccountSession" } }
  /v1/me/quota:
    get:
      operationId: getMyQuota
      security: [{ webCookie: [] }]
      responses: { "200": { description: Current UTC cycle, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } } }
  /v1/me/devices:
    get:
      operationId: listMyDevices
      security: [{ webCookie: [] }]
      responses:
        "200":
          description: Devices, including revoked history and the active-device limit
          content:
            application/json:
              schema:
                type: object
                required: [devices, limit]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
                  limit: { const: 2 }
  /v1/me/devices/{deviceId}:
    delete:
      operationId: revokeMyDevice
      security: [{ webCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Revoked }, "404": { $ref: "#/components/responses/Error" } }
  /v1/bug-reports:
    post:
      operationId: createBugReport
      security: [{ webCookie: [], csrf: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "#/components/schemas/BugReportRequest" } } }
      responses: { "201": { description: One-way report receipt }, "422": { $ref: "#/components/responses/Error" } }
  /v1/desktop/auth/login:
    post:
      operationId: desktopLogin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DesktopLoginRequest" } } }
      responses: { "200": { $ref: "#/components/responses/DesktopSession" }, "409": { $ref: "#/components/responses/Error" } }
  /v1/desktop/auth/refresh:
    post:
      operationId: desktopRefresh
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DesktopRefreshRequest" } } }
      responses: { "200": { $ref: "#/components/responses/DesktopSession" }, "401": { $ref: "#/components/responses/Error" } }
  /v1/desktop/auth/logout:
    post:
      operationId: desktopLogout
      security: [{ desktopBearer: [] }]
      responses: { "204": { description: Revoked } }
  /v1/desktop/me:
    get:
      operationId: desktopMe
      security: [{ desktopBearer: [] }]
      responses: { "200": { $ref: "#/components/responses/AccountSession" } }
  /v1/desktop/telemetry/batch:
    post:
      operationId: uploadTelemetryBatch
      security: [{ reporterBearer: [] }, { desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TelemetryBatch" } } }
      responses: { "202": { description: Idempotent batch accepted }, "422": { $ref: "#/components/responses/Error" } }
  /v1/desktop/crashes:
    post:
      operationId: uploadCrash
      security: [{ reporterBearer: [] }, { desktopBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata: { type: string, description: JSON-encoded CrashMetadata object }
                artifact: { type: string, format: binary, description: UTF-8 crash log preferred; at most 50 MiB }
      responses: { "201": { description: Crash stored } }
  /v1/desktop/ai/models:
    get:
      operationId: listDesktopAIModels
      summary: Public metadata for enabled administrator-managed models
      security: [{ desktopBearer: [] }]
      responses:
        "200":
          description: Selectable managed models; endpoint URLs and provider keys are issued only by a checked one-request lease
          content: { application/json: { schema: { type: object, properties: { models: { type: array, items: { $ref: "#/components/schemas/DesktopAIModel" } } } } } }
  /v1/desktop/ai/models/{modelId}/lease:
    post:
      operationId: leaseDesktopAIModel
      summary: Check the current model and quota, then issue its direct provider configuration for one request
      security: [{ desktopBearer: [] }]
      parameters:
        - { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { $ref: "#/components/requestBodies/AILeaseRequest" }
      responses:
        "201":
          description: Ephemeral direct-provider configuration; must not be cached or persisted
          content: { application/json: { schema: { $ref: "#/components/schemas/AIModelLease" } } }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/desktop/ai/reservations/{reservationId}/settle:
    post:
      operationId: settleDesktopAIReservation
      summary: Settle a direct provider request against the authenticated user's reservation
      security: [{ desktopBearer: [] }]
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { $ref: "#/components/requestBodies/AISettlementRequest" }
      responses:
        "200":
          description: Updated quota after settlement
          content: { application/json: { schema: { type: object, required: [quota], properties: { quota: { $ref: "#/components/schemas/Quota" } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desktop/ai/models/{modelId}/invoke:
    post:
      operationId: invokeDesktopAIModel
      deprecated: true
      summary: Compatibility proxy for older desktop builds
      security: [{ desktopBearer: [] }]
      parameters:
        - { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { $ref: "#/components/requestBodies/AIProviderRequest" }
      responses: { "200": { description: Provider JSON or SSE stream }, "402": { $ref: "#/components/responses/Error" } }
  /v1/desktop/ai/prompts:
    get:
      operationId: getAIPrompts
      summary: The assistant's instructions — the main prompt and every playbook
      description: >
        Served rather than compiled in, so the assistant's behaviour can be
        edited in the admin panel without a release. Send If-None-Match with the
        ETag of the copy already cached; the usual answer is 304.
      security: [{ desktopBearer: [] }]
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200": { description: The prompt pack }
        "304": { description: Unchanged since the cached copy }
        "503": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects:
    get:
      operationId: listCloudProjects
      summary: List cloud projects visible to the signed-in desktop user
      security: [{ desktopBearer: [] }]
      responses:
        "200":
          description: Projects owned by or shared with the user
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/CloudProjectView" } }
    post:
      operationId: createCloudProject
      summary: Create an uploading cloud-project shell
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateCloudProjectRequest" } } }
      responses:
        "201": { description: Uploading project created, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectView" } } } }
        "422": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getCloudProject
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Project and caller role, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectView" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCloudProject
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCloudProjectRequest" } } }
      responses:
        "200": { description: Project updated, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectView" } } } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveCloudProject
      summary: Archive the project after any live session has an exact-head snapshot
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/publish:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: completeCloudProjectPublication
      summary: Atomically activate an uploading project after a verified head snapshot and assets exist
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Project activated, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectView" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/bootstrap:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: after_seq, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
    get:
      operationId: bootstrapCloudProject
      summary: Fetch the newest snapshot plus the ordered operation page after a sequence
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Bootstrap materialization input, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectBootstrap" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/ops:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: appendCloudProjectOperation
      summary: Sequence one durable command for an editor joined from this device
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../protocol/schema/project-command-v1.schema.json" }
      responses:
        "201": { description: New operation committed, content: { application/json: { schema: { $ref: "#/components/schemas/AppendOperationResult" } } } }
        "200": { description: Idempotent retry returned the original operation, content: { application/json: { schema: { $ref: "#/components/schemas/AppendOperationResult" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/ops/{opId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/OpId" }
    get:
      operationId: getCloudProjectOperationStatus
      summary: Authoritatively check whether an operation identifier is durable at the current project head
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Operation durability status; an absent operation is not an error, content: { application/json: { schema: { $ref: "#/components/schemas/OperationStatus" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/asset-uploads/prepare:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: prepareCloudProjectAssetUpload
      summary: Deduplicate an asset or prepare bounded single/multipart staging PUTs
      description: Large objects use provider-side multipart upload. partNumberStart explicitly pages missing part URLs without changing uploadId idempotency. Returned URLs are sensitive delegated access and must never be logged; the opaque provider upload identifier is never returned separately. Object keys contain UUIDs only, never client filenames or paths.
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrepareAssetUploadRequest" } } }
      responses:
        "200": { description: Idempotent upload preparation, content: { application/json: { schema: { $ref: "#/components/schemas/UploadPreparation" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/asset-uploads/{uploadId}/complete:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/UploadId" }]
    post:
      operationId: completeCloudProjectAssetUpload
      summary: Stream, hash, seal and atomically link an uploaded asset
      description: The server independently verifies exact SHA-256 and byte size, promotes into immutable content-addressed storage, then creates the project asset. Client checksum metadata alone is never trusted.
      security: [{ desktopBearer: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteMultipartUploadRequest" } } }
      responses:
        "200": { description: Asset is verified and may now be referenced by a document command, content: { application/json: { schema: { $ref: "#/components/schemas/CompletedProjectAsset" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/uploads/{uploadId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/UploadId" }]
    delete:
      operationId: abortCloudProjectUpload
      summary: Idempotently abort an open asset or snapshot staging upload
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: Upload aborted; staging cleanup is asynchronous-safe }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/snapshot-uploads/prepare:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: prepareCloudProjectSnapshotUpload
      summary: Deduplicate or prepare a resumable canonical v6 snapshot at the exact requested head
      description: Initial publication is owner-authorized. During a live session, only the server-assigned host for a pending snapshot.requested target may prepare the upload; an ending session keeps that target frozen. assetIds is the exact set of AssetRefs parsed from the canonical snapshot; the server normalizes it and verifies every declared project asset before prepare and complete.
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrepareSnapshotUploadRequest" } } }
      responses:
        "200": { description: Idempotent snapshot upload preparation, content: { application/json: { schema: { $ref: "#/components/schemas/UploadPreparation" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/snapshot-uploads/{uploadId}/complete:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/UploadId" }]
    post:
      operationId: completeCloudProjectSnapshotUpload
      summary: Verify a canonical snapshot and attach it only at the exact requested current head
      description: Provider bytes are verified before the database transaction. For session_end, linking the exact snapshot, completing the request, and changing the live session from ending to ended are one transaction.
      security: [{ desktopBearer: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/CompleteMultipartUploadRequest" } } }
      responses:
        "200": { description: Snapshot verified and attached, content: { application/json: { schema: { $ref: "#/components/schemas/CompletedProjectSnapshot" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/assets/{assetId}/download:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: prepareCloudProjectAssetDownload
      summary: Issue an authorized short-lived GET for a verified asset
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Sensitive short-lived download request, content: { application/json: { schema: { $ref: "#/components/schemas/PresignedDownload" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/snapshots/{snapshotId}/download:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: prepareCloudProjectSnapshotDownload
      summary: Issue an authorized short-lived GET for a verified bootstrap snapshot
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Sensitive short-lived download request, content: { application/json: { schema: { $ref: "#/components/schemas/PresignedDownload" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: listCloudProjectMembers
      security: [{ desktopBearer: [] }]
      responses:
        "200":
          description: Project members other than the owner
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
  /v1/desktop/projects/{projectId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putCloudProjectMember
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, color_index]
              properties:
                role: { enum: [editor, viewer] }
                color_index: { type: integer, minimum: 0, maximum: 31 }
      responses:
        "200": { description: Member role saved, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeCloudProjectMember
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: Member removed and active devices evicted }
        "403": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/ownership:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: transferCloudProjectOwnership
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetUserId]
              properties: { targetUserId: { type: string, format: uuid } }
      responses:
        "200": { description: Ownership transferred }
        "403": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/invites:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: createCloudProjectInvite
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateProjectInviteRequest" } } }
      responses:
        "201": { description: One-use invitation; token is returned only here, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedProjectInvite" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/invites/{inviteId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: revokeCloudProjectInvite
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: Invitation revoked }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/project-invites/accept:
    post:
      operationId: acceptCloudProjectInvite
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties: { token: { type: string, minLength: 32, maxLength: 256, writeOnly: true } }
      responses:
        "200": { description: Membership created, content: { application/json: { schema: { $ref: "#/components/schemas/CloudProjectView" } } } }
        "410": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      operationId: startCloudProjectSession
      summary: Owner-only live-session start
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartProjectSessionRequest" }
      responses:
        "201": { description: Session started and owner device joined, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSessionState" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/active:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      operationId: getActiveCloudProjectSession
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Active session, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSessionState" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/SessionId" }
    delete:
      operationId: endCloudProjectSession
      summary: Freeze and end a session as its host or project owner
      description: If head_seq is not yet snapshotted, the session enters ending and remains recoverable until the assigned host uploads a verified exact-head snapshot. The WebSocket session.ended event is emitted only after that commit.
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: End accepted; the session is ended now or is waiting in ending for its exact-head snapshot }
        "403": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/join:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: joinCloudProjectSession
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCompatibilityRequest" }
      responses:
        "200": { description: Device joined, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSessionState" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/leave:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: leaveCloudProjectSession
      security: [{ desktopBearer: [] }]
      responses:
        "200": { description: Device left and host was reconciled, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSessionState" } } } }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: heartbeatCloudProjectSession
      security: [{ desktopBearer: [] }]
      responses: { "200": { description: Presence lease refreshed } }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/host:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: handoffCloudProjectSessionHost
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_member_id]
              properties: { target_member_id: { type: string, format: uuid } }
      responses:
        "200": { description: Host changed, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSessionState" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/leases:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: acquireProjectRecordingLease
      security: [{ desktopBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TrackLeaseRequest" } } }
      responses:
        "201": { description: Exclusive track recording lease granted, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectTrackLease" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/desktop/projects/{projectId}/sessions/{sessionId}/leases/{leaseId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/SessionId" }
      - { name: leaseId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renewProjectRecordingLease
      security: [{ desktopBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { ttl_seconds: { type: integer, minimum: 5, maximum: 120 } }
      responses:
        "200": { description: Lease renewed, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectTrackLease" } } } }
    delete:
      operationId: releaseProjectRecordingLease
      security: [{ desktopBearer: [] }]
      responses:
        "204": { description: Lease released }
  /v1/admin/ai/prompts:
    get:
      operationId: adminListAIPrompts
      security: [{ adminSession: [] }]
      responses: { "200": { description: Every instruction document, with its text } }
    post:
      operationId: adminCreateAIPrompt
      summary: Add a playbook
      security: [{ adminSession: [] }]
      responses: { "201": { description: The new document }, "409": { $ref: "#/components/responses/Error" } }
  /v1/admin/ai/models:
    get:
      operationId: adminListAIModels
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Every administrator-managed model; keys are represented only by has_api_key
          content: { application/json: { schema: { type: object, properties: { models: { type: array, items: { $ref: "#/components/schemas/AdminAIModel" } } } } } }
    post:
      operationId: adminCreateAIModel
      security: [{ adminCookie: [], csrf: [] }]
      requestBody: { $ref: "#/components/requestBodies/AIModelWrite" }
      responses: { "201": { description: Model created }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/ai/models/{modelId}:
    parameters:
      - { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: adminUpdateAIModel
      security: [{ adminCookie: [], csrf: [] }]
      requestBody: { $ref: "#/components/requestBodies/AIModelWrite" }
      responses: { "200": { description: Model updated }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: adminDeleteAIModel
      security: [{ adminCookie: [], csrf: [] }]
      responses: { "200": { description: Model deleted }, "404": { $ref: "#/components/responses/Error" } }
  /v1/admin/ai/prompts/{promptId}:
    parameters:
      - { name: promptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: adminGetAIPrompt
      security: [{ adminSession: [] }]
      responses: { "200": { description: One document }, "404": { $ref: "#/components/responses/Error" } }
    put:
      operationId: adminUpdateAIPrompt
      summary: Edit a document, keeping the text it replaced as a revision
      security: [{ adminSession: [] }]
      responses: { "200": { description: The saved document }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: adminDeleteAIPrompt
      security: [{ adminSession: [] }]
      responses: { "200": { description: Deleted }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/ai/prompts/{promptId}/revert:
    post:
      operationId: adminRevertAIPrompt
      summary: Put back the text the desktop build ships with
      security: [{ adminSession: [] }]
      parameters:
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: The restored document }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/ai/prompts/{promptId}/revisions:
    get:
      operationId: adminAIPromptRevisions
      security: [{ adminSession: [] }]
      parameters:
        - { name: promptId, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: The last 50 revisions } }
  /v1/admin/auth/login:
    post:
      operationId: adminLogin
      requestBody: { $ref: "#/components/requestBodies/Login" }
      responses: { "200": { description: Admin session }, "401": { $ref: "#/components/responses/Error" } }
  /v1/admin/auth/logout:
    post:
      operationId: adminLogout
      security: [{ adminCookie: [], csrf: [] }]
      responses: { "204": { description: Signed out } }
  /v1/admin/me:
    get:
      operationId: adminGetMe
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Current administrator and CSRF token }, "401": { $ref: "#/components/responses/Error" } }
  /v1/admin/dashboard:
    get:
      operationId: adminDashboard
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Operational counters } }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      security: [{ adminCookie: [] }]
      responses: { "200": { description: User registry } }
  /v1/admin/users/{userId}:
    get:
      operationId: adminGetUser
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "200": { description: Full user profile } }
    delete:
      operationId: adminDeleteUser
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirmation" }
      responses: { "204": { description: Account and related data deleted } }
  /v1/admin/users/{userId}/telemetry:
    get:
      operationId: adminGetUserTelemetry
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "200": { description: Sessions, hardware snapshots, samples, and aggregate plugin data } }
  /v1/admin/users/{userId}/ledger:
    get:
      operationId: adminGetUserTokenLedger
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "200": { description: Current quota cycle and immutable token ledger } }
  /v1/admin/users/{userId}/suspend:
    post:
      operationId: adminSuspendUser
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "204": { description: User suspended and all sessions revoked } }
  /v1/admin/users/{userId}/activate:
    post:
      operationId: adminActivateUser
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "204": { description: User activated } }
  /v1/admin/users/{userId}/tokens/add:
    post:
      operationId: adminAddUserTokens
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [amount], properties: { amount: { type: integer, format: int64 } } } } }
      responses: { "200": { description: Updated current UTC quota cycle, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } } }
  /v1/admin/users/{userId}/tokens/reset:
    post:
      operationId: adminResetUserTokens
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/PasswordConfirmation" }
      responses: { "200": { description: Reset current UTC quota cycle, content: { application/json: { schema: { $ref: "#/components/schemas/Quota" } } } }, "401": { $ref: "#/components/responses/Error" } }
  /v1/admin/users/{userId}/devices/{deviceId}/revoke:
    post:
      operationId: adminRevokeUserDevice
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }, { $ref: "#/components/parameters/DeviceId" }]
      responses: { "204": { description: Device and its desktop sessions revoked } }
  /v1/admin/users/{userId}/sessions/revoke:
    post:
      operationId: adminRevokeUserSessions
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "204": { description: Web and desktop sessions revoked } }
  /v1/admin/users/{userId}/diagnostics:
    delete:
      operationId: adminDeleteUserDiagnostics
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses: { "204": { description: Telemetry, crashes, bug reports, and diagnostic files deleted } }
  /v1/admin/bugs:
    get:
      operationId: adminListBugs
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Bug registry } }
  /v1/admin/bugs/{bugId}:
    patch:
      operationId: adminUpdateBug
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/BugId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BugUpdateRequest" } } }
      responses: { "204": { description: Bug status and internal note updated } }
  /v1/admin/bugs/{bugId}/attachments/{attachmentId}:
    get:
      operationId: adminDownloadBugAttachment
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/BugId" }, { $ref: "#/components/parameters/AttachmentId" }]
      responses: { "200": { description: Sanitized image attachment, content: { image/jpeg: {}, image/png: {}, image/webp: {} } } }
  /v1/admin/crashes:
    get:
      operationId: adminListCrashes
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Crash registry } }
  /v1/admin/crashes/{crashId}/artifact:
    get:
      operationId: adminDownloadCrashArtifact
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CrashId" }]
      responses: { "200": { description: Readable crash log or a legacy binary artifact, content: { text/plain: {}, application/json: {}, application/octet-stream: {} } }, "404": { $ref: "#/components/responses/Error" } }
  /v1/admin/audit:
    get:
      operationId: adminAudit
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Append-only administrative audit } }
  /v1/admin/releases:
    get:
      operationId: adminListReleases
      security: [{ adminCookie: [] }]
      responses: { "200": { description: Draft and published releases, content: { application/json: { schema: { type: object, required: [releases], properties: { releases: { type: array, items: { $ref: "#/components/schemas/AdminRelease" } } } } } } } }
    post:
      operationId: adminCreateRelease
      security: [{ adminCookie: [], csrf: [] }]
      requestBody: { $ref: "#/components/requestBodies/ReleaseWrite" }
      responses: { "201": { description: Saved draft, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRelease" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/releases/{releaseId}:
    get:
      operationId: adminGetRelease
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
      responses: { "200": { description: Release editor state, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRelease" } } } } }
    put:
      operationId: adminUpdateRelease
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
      requestBody: { $ref: "#/components/requestBodies/ReleaseWrite" }
      responses: { "200": { description: Saved release, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRelease" } } } }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: adminDeleteRelease
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
      responses: { "204": { description: Draft and stored files deleted }, "409": { $ref: "#/components/responses/Error" } }
  /v1/admin/releases/{releaseId}/publish:
    post:
      operationId: adminPublishRelease
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
      responses: { "200": { description: Published release, content: { application/json: { schema: { $ref: "#/components/schemas/AdminRelease" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/releases/{releaseId}/artifacts/{kind}:
    put:
      operationId: adminUploadReleaseArtifact
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }, { $ref: "#/components/parameters/ArtifactKind" }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } }
      responses: { "200": { description: Uploaded or atomically replaced artifact, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseArtifact" } } } }, "413": { $ref: "#/components/responses/Error" }, "422": { $ref: "#/components/responses/Error" } }
    delete:
      operationId: adminDeleteReleaseArtifact
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }, { $ref: "#/components/parameters/ArtifactKind" }]
      responses: { "204": { description: Artifact deleted }, "409": { $ref: "#/components/responses/Error" } }
  /v1/admin/releases/{releaseId}/screenshots:
    post:
      operationId: adminUploadReleaseScreenshot
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                caption_ru: { type: string, maxLength: 1000 }
                caption_en: { type: string, maxLength: 1000 }
                sort_order: { type: integer }
      responses: { "201": { description: Sanitized screenshot, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseScreenshot" } } } }, "422": { $ref: "#/components/responses/Error" } }
  /v1/admin/releases/{releaseId}/screenshots/{screenshotId}:
    put:
      operationId: adminUpdateReleaseScreenshot
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }, { $ref: "#/components/parameters/ScreenshotId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseScreenshotWrite" } } }
      responses: { "200": { description: Updated screenshot metadata, content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseScreenshot" } } } } }
    delete:
      operationId: adminDeleteReleaseScreenshot
      security: [{ adminCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }, { $ref: "#/components/parameters/ScreenshotId" }]
      responses: { "204": { description: Screenshot deleted } }
  /v1/admin/releases/{releaseId}/screenshots/{screenshotId}/file:
    get:
      operationId: adminGetReleaseScreenshotFile
      security: [{ adminCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/ReleaseId" }, { $ref: "#/components/parameters/ScreenshotId" }]
      responses: { "200": { description: Sanitized screenshot preview, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }, "404": { $ref: "#/components/responses/Error" } }
components:
  securitySchemes:
    webCookie: { type: apiKey, in: cookie, name: vlt_web_session }
    adminCookie: { type: apiKey, in: cookie, name: vlt_admin_session }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
    desktopBearer: { type: http, scheme: bearer, bearerFormat: Ed25519 }
    reporterBearer: { type: http, scheme: bearer, bearerFormat: opaque }
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    OpId: { name: opId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    UploadId: { name: uploadId, in: path, required: true, schema: { type: string, format: uuid } }
    BugId: { name: bugId, in: path, required: true, schema: { type: string, format: uuid } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
    CrashId: { name: crashId, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseVersion: { name: version, in: path, required: true, schema: { type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' } }
    ScreenshotId: { name: screenshotId, in: path, required: true, schema: { type: string, format: uuid } }
    ArtifactKind: { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/ArtifactKind" } }
    Platform: { name: platform, in: query, required: true, schema: { type: string, enum: [windows, macos, linux] } }
    Locale: { name: locale, in: query, required: false, schema: { type: string, enum: [ru, en], default: en } }
  requestBodies:
    Login:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
    PasswordConfirmation:
      required: true
      content: { application/json: { schema: { type: object, additionalProperties: false, required: [password], properties: { password: { type: string, minLength: 12, maxLength: 128 } } } } }
    AIProviderRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [model]
            properties:
              model: { type: string }
            additionalProperties: true
    AILeaseRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [input_bytes, max_output_tokens]
            properties:
              input_bytes: { type: integer, format: int64, minimum: 1, maximum: 4194304 }
              max_output_tokens: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
    AISettlementRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [actual_tokens, outcome]
            properties:
              actual_tokens: { type: integer, format: int64, minimum: 0 }
              outcome: { type: string, enum: [provider_usage, provider_rejected, transport_failure, cancelled, conservative_no_usage] }
    AIModelWrite:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AIModelWrite"
    ReleaseWrite:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/ReleaseWrite" } } }
  responses:
    Error:
      description: Structured API error
      content: { application/json: { schema: { $ref: "#/components/schemas/APIError" } } }
    AccountSession:
      description: Authenticated account state
      content: { application/json: { schema: { $ref: "#/components/schemas/AccountSession" } } }
    DesktopSession:
      description: Rotating desktop credentials and offline entitlement
      content: { application/json: { schema: { $ref: "#/components/schemas/DesktopSession" } } }
  schemas:
    APIError:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: string }
        message: { type: string }
        field_errors: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
    CloudProject:
      type: object
      additionalProperties: false
      required: [id, owner_user_id, title, status, format_version, engine_version, minimum_app_version, head_seq, snapshot_seq, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        status: { enum: [uploading, active, read_only, conflict, archived] }
        format_version: { type: integer, minimum: 1 }
        engine_version: { type: string, maxLength: 64 }
        minimum_app_version: { type: string, maxLength: 64 }
        head_seq: { type: integer, format: int64, minimum: 0 }
        snapshot_seq: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
