    ProjectSnapshot:
      type: object
      additionalProperties: false
      required: [id, project_id, seq, blob_id, schema_version, asset_ids, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, minimum: 0 }
        blob_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        asset_ids:
          type: array
          maxItems: 100000
          uniqueItems: true
          description: Exact normalized lexicographically sorted manifest; clients must compare it with AssetRefs parsed from the downloaded canonical snapshot.
          items: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    PrepareAssetUploadRequest:
      type: object
      additionalProperties: false
      required: [uploadId, assetId, sha256, byteSize, kind, contentType, displayName]
      properties:
        uploadId: { type: string, format: uuid, description: Client-generated idempotency identifier }
        assetId: { type: string, format: uuid, description: Stable document asset identifier }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 68719476736 }
        kind: { enum: [audio, sample, plugin_state, other] }
        contentType: { type: string, minLength: 1, maxLength: 160 }
        displayName: { type: string, minLength: 1, maxLength: 255, description: Basename only; directory components are discarded }
        partNumberStart: { type: integer, minimum: 1, maximum: 1000, description: Explicit first part considered for this missing-URL page; omitted means 1 and is excluded from the upload idempotency hash }
    PrepareSnapshotUploadRequest:
      type: object
      additionalProperties: false
      required: [uploadId, seq, schemaVersion, sha256, byteSize, contentType, assetIds]
      properties:
        uploadId: { type: string, format: uuid, description: Client-generated idempotency identifier }
        seq: { type: integer, format: int64, minimum: 0 }
        schemaVersion: { const: 6 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        byteSize: { type: integer, format: int64, minimum: 1, maximum: 68719476736 }
        contentType: { type: string, minLength: 1, maxLength: 160 }
        assetIds:
          type: array
          maxItems: 100000
          uniqueItems: true
          description: Exact AssetRef identifiers in the canonical snapshot. Input order is arbitrary; the server canonicalizes it for upload idempotency. Use an empty array when there are no assets.
          items: { type: string, format: uuid, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        partNumberStart: { type: integer, minimum: 1, maximum: 1000, description: Explicit first part considered for this missing-URL page; omitted means 1 and is excluded from the upload idempotency hash }
    CompleteMultipartPart:
      type: object
      additionalProperties: false
      required: [partNumber, eTag]
      properties:
        partNumber: { type: integer, minimum: 1, maximum: 1000 }
        eTag: { type: string, minLength: 1, maxLength: 256, description: Exact ETag response header, including provider quotes when present }
    CompleteMultipartUploadRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 2
          maxItems: 1000
          description: Strictly ordered contiguous parts 1..N; the server compares every ETag and byte size with provider ListParts before signing completion
          items: { $ref: "#/components/schemas/CompleteMultipartPart" }
    PresignedRequest:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method: { enum: [PUT, GET] }
        url: { type: string, format: uri, x-vlt-sensitive: true, description: Delegated URL; redact it from all logs and telemetry }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Every returned header must be sent exactly; no storage credentials are included
        expiresAt: { type: string, format: date-time }
    UploadPreparation:
      type: object
      additionalProperties: false
      required: [uploadId, status, uploadMode, alreadyAvailable, expiresAt]
      properties:
        uploadId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        snapshotSeq: { type: integer, format: int64, minimum: 0 }
        status: { enum: [uploading, completed] }
        uploadMode: { enum: [single, multipart] }
        alreadyAvailable: { type: boolean }
        request: { $ref: "#/components/schemas/PresignedRequest" }
        multipartPartSize: { type: integer, format: int64, minimum: 5242880, maximum: 5368709120 }
        multipartPartCount: { type: integer, minimum: 2, maximum: 1000 }
        uploadedParts:
          type: array
          maxItems: 1000
          description: Provider-observed resumable state; ETags are opaque and are not treated as checksums
          items:
            type: object
            additionalProperties: false
            required: [partNumber, byteSize, eTag]
            properties:
              partNumber: { type: integer, minimum: 1, maximum: 1000 }
              byteSize: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }
              eTag: { type: string, minLength: 1, maxLength: 256 }
        parts:
          type: array
          maxItems: 200
          description: Missing provider parts in the explicit page, each with an independently expiring delegated PUT
          items:
            type: object
            additionalProperties: false
            required: [partNumber, byteSize, request]
            properties:
              partNumber: { type: integer, minimum: 1, maximum: 1000 }
              byteSize: { type: integer, format: int64, minimum: 1, maximum: 5368709120 }
              request: { $ref: "#/components/schemas/PresignedRequest" }
        nextPartNumberStart: { type: integer, minimum: 1, maximum: 1000, description: Explicit cursor for the next missing-URL page }
        expiresAt: { type: string, format: date-time }
