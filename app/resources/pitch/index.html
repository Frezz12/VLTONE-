<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'; font-src qrc:; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>VLT Pitch</title>
  <link rel="stylesheet" href="pitch.css">
  <script defer src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script defer src="pitch.js"></script>
</head>
<body>
<main class="instrument" aria-label="VLT Pitch vocal correction">
  <header>
    <div class="brand"><span>VLT</span> PITCH<span class="edition">VOCAL PROCESSOR</span></div>
    <div class="header-actions">
      <label class="preset-wrap"><span class="sr-only">Preset</span><select id="preset" aria-label="Preset"><option>Default</option></select></label>
      <button class="utility" id="send-to-all" aria-label="Send settings to all other VLT Pitch instances" title="Send settings to all other VLT Pitch instances"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v7M5 16v-5h14v5M12 11v5M9 7l3-3 3 3"/><rect x="2.5" y="16" width="5" height="4" rx="1"/><rect x="9.5" y="16" width="5" height="4" rx="1"/><rect x="16.5" y="16" width="5" height="4" rx="1"/></svg></button>
      <button class="utility" id="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16M2 9h6M9 15h6M16 8h6"/></svg></button>
      <button class="power" id="active" aria-label="Pitch correction active" aria-pressed="true" title="Bypass"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
  </header>
  <div class="configuration">
    <div class="tonality"><label><span class="sr-only">Key</span><select id="key" data-param="4" aria-label="Key"></select></label><label><span class="sr-only">Scale</span><select id="scale" data-param="5" aria-label="Scale"></select></label></div>
    <label class="reference">A4 <input id="a4" data-param="3" type="number" min="400" max="480" step="0.1" aria-label="A4 frequency"> Hz</label>
    <label><span class="sr-only">Quality</span><select id="quality" data-param="11" aria-label="Processing quality"><option value="0">Real-Time</option><option value="1">HD</option></select></label>
  </div>
  <section class="controls" aria-label="Correction controls">
    <div class="control retune">
      <label id="retune-label" class="caption">RETUNE SPEED</label>
      <div class="dial large" id="retune" data-dial="0" role="slider" tabindex="0" aria-labelledby="retune-label" aria-valuemin="0" aria-valuemax="200" aria-orientation="vertical" title="Drag up for faster tuning. Shift: fine. Double-click: reset. Right-click: automation."><div class="dial-ring"></div><div class="dial-face"><span class="pointer"></span></div></div>
      <label class="value retune-value"><input id="retune-value" data-param="0" type="number" min="0" max="200" step="0.1" aria-label="Retune speed in milliseconds"><span>ms</span><span id="hard-label">SNAP</span></label>
    </div>
    <div class="control">
      <label id="human-label" class="caption">HUMANIZE</label>
      <div class="dial" id="humanize" data-dial="1" role="slider" tabindex="0" aria-labelledby="human-label" aria-valuemin="0" aria-valuemax="100" aria-orientation="vertical" title="Drag to adjust. Shift: fine. Double-click: reset. Right-click: automation."><div class="dial-ring"></div><div class="dial-face"><span class="pointer"></span></div></div>
      <label class="value"><input id="humanize-value" data-param="1" type="number" min="0" max="100" step="1" aria-label="Humanize amount"><span>%</span></label>
    </div>
    <div class="control">
      <label id="vibrato-label" class="caption">VIBRATO</label>
      <div class="dial" id="vibrato" data-dial="2" role="slider" tabindex="0" aria-labelledby="vibrato-label" aria-valuemin="0" aria-valuemax="100" aria-orientation="vertical" title="Drag to adjust. Shift: fine. Double-click: reset. Right-click: automation."><div class="dial-ring"></div><div class="dial-face"><span class="pointer"></span></div></div>
      <label class="value"><input id="vibrato-value" data-param="2" type="number" min="0" max="100" step="1" aria-label="Vibrato preservation"><span>%</span></label>
    </div>
    <div class="readout" aria-label="Detected pitch">
      <span class="caption">PITCH</span>
      <div class="notes"><span id="input-note">—</span><span class="arrow">›</span><strong id="target-note">—</strong></div>
      <span id="cents">0 ct</span>
      <button class="formants" id="formants" data-param="7" aria-pressed="true"><i></i> FORMANTS</button>
    </div>
  </section>
  <div class="piano-bed"><div class="piano" id="piano" role="group" aria-label="Allowed notes. Click a key to include or exclude it."></div></div>
  <footer><span id="status" role="status">Click keys to set your scale</span><span id="latency">10 ms latency</span></footer>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <form method="dialog"><h2 id="settings-title">Fine tuning</h2><button class="close utility" aria-label="Close settings">×</button></form>
  <div class="settings-grid">
    <label>Voice range<select id="voice" data-param="6"><option value="0">Auto</option><option value="1">Low</option><option value="2">Mid</option><option value="3">High</option></select></label>
    <label>Correction amount<span class="field"><input id="amount" data-param="8" type="number" min="0" max="100" step="1">%</span></label>
    <label>Output level<span class="field"><input id="output" data-param="9" type="number" min="-24" max="12" step="0.1">dB</span></label>
  </div>
  <p class="help">0 ms gives the hardest note transitions. Humanize and Vibrato taper off at the fastest settings.</p>
  <div class="save-row"><label class="sr-only" for="preset-name">Preset name</label><input id="preset-name" maxlength="48" placeholder="Name your preset"><button id="save-preset" class="raised">Save preset</button></div>
  <div class="preset-actions"><button id="delete-preset" class="text-button">Delete current preset</button><button id="replace-preset" class="raised" hidden>Replace preset</button></div>
  <p id="preset-message" role="status"></p>
</dialog>
<div id="automation-menu" role="menu" hidden><button role="menuitem" id="automate">Create automation clip</button></div>
</body>
</html>
