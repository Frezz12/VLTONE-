<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Flowers Delay</title>
  <link rel="stylesheet" href="delay.css">
  <script src="qrc:///qtwebchannel/qwebchannel.js" defer></script>
  <script src="delay.js" defer></script>
</head>
<body>
<main id="panel" aria-label="Flowers Delay">
  <header>
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 2 7 8 10 3-1 11 1 11-10 3-7 8-7-8-10-3 1-11-1-11 10-3Z"/><circle cx="24" cy="24" r="11"/><circle cx="24" cy="24" r="4"/></svg><h1>Flowers Delay</h1></div>
    <div class="character-field"><label for="character">CHARACTER</label><select id="character" aria-describedby="character-description"></select><span id="character-description">Pure, open repeats</span></div>
    <div id="amount-slot" class="amount-slot"></div>
  </header>
  <div class="instrument">
    <section class="tap-section" aria-label="Tap tempo">
      <button id="tap" title="Select BPM or ms to tap a tempo" disabled><svg viewBox="0 0 60 60" aria-hidden="true"><path d="m30 6 8 8 11 3-1 13 1 13-11 3-8 8-8-8-11-3 1-13-1-13 11-3Z"/><circle cx="30" cy="30" r="10"/></svg></button>
      <label for="tap">TAP</label><span id="tap-hint">HOST SYNC</span>
      <div class="confetti" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </section>
    <section class="module" aria-label="Time and modulation">
      <div id="time-slot" class="primary-slot"></div>
      <div class="section-label">MODULATION</div>
      <div class="pair"><div id="depth-slot"></div><div id="rate-slot"></div></div>
    </section>
    <section class="centre" aria-label="Delay timing">
      <div class="segments routing" role="group" aria-label="Routing"><button id="stereo" aria-pressed="true">STEREO</button><button id="pingPong" aria-pressed="false">PING PONG</button></div>
      <div class="orbit">
        <svg id="echo-art" viewBox="0 0 360 360" aria-hidden="true">
          <g class="orbits"><circle cx="180" cy="180" r="166"/><circle cx="180" cy="180" r="149"/><circle cx="180" cy="180" r="133"/></g>
          <g id="petals"></g><g id="satellites"></g>
          <path class="crosshair" d="M180 5v14M180 341v14M5 180h14M341 180h14"/>
        </svg>
        <div class="time-display"><span class="eyebrow">TIME</span><select id="division" aria-label="Musical division"></select><input id="timeMs-value" type="number" min="1" max="8000" step="0.1" aria-label="Delay time in milliseconds" hidden><span id="time-unit">375.0 ms</span><div class="tempo"><input id="bpm-value" type="number" min="30" max="300" step="0.1" aria-label="Local tempo" disabled><span id="tempo-unit">BPM · HOST</span></div></div>
      </div>
      <div class="segments source" role="group" aria-label="Time source"><button id="host" aria-pressed="true">HOST</button><button id="local" aria-pressed="false">BPM</button><button id="milliseconds" aria-pressed="false">ms</button></div>
      <output id="time-limit" aria-live="polite"></output>
    </section>
    <section class="module" aria-label="Feedback and filters"><div id="feedback-slot" class="primary-slot"></div><div class="section-label">FILTERS</div><div class="pair"><div id="low-slot"></div><div id="high-slot"></div></div></section>
    <section class="levels" aria-label="Mix and output"><div id="mix-slot"></div><div id="output-slot"></div></section>
  </div>
  <footer><span>STEREO ECHO PROCESSOR</span><div class="signal"><i id="signal-led" aria-hidden="true"></i><output id="signal" role="meter" aria-label="Wet signal level" aria-valuemin="-60" aria-valuemax="12" aria-valuenow="-60">READY</output></div></footer>
</main>
<div id="menu" role="menu" hidden><button id="reset" role="menuitem">Reset to default</button><button id="automate" role="menuitem">Create automation</button></div>
<div id="unavailable" role="status" hidden>Flowers Delay is no longer available.</div>
</body>
</html>
