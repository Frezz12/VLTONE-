# Example only. Replace both example domains and certificate paths before enabling.
# Required modules: headers proxy proxy_http proxy_wstunnel rewrite ssl.

<VirtualHost *:80>
    ServerName studio.example.com
    Redirect permanent / https://studio.example.com/
</VirtualHost>

<VirtualHost *:80>
    ServerName admin.example.com
    Redirect permanent / https://admin.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName studio.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/studio.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/studio.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyTimeout 3600
    RequestHeader set X-Forwarded-Proto "https"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} ^websocket$ [NC]
    RewriteCond %{HTTP:Connection} (^|,)[[:space:]]*upgrade([[:space:]]*,|$) [NC]
    RewriteRule ^/api/(.*)$ ws://127.0.0.1:8080/$1 [P,L]
    ProxyPass /api/ http://127.0.0.1:8080/
    ProxyPassReverse /api/ http://127.0.0.1:8080/
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.example.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/admin.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/admin.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:8080/
    ProxyPassReverse /api/ http://127.0.0.1:8080/
    ProxyPass / http://127.0.0.1:3101/
    ProxyPassReverse / http://127.0.0.1:3101/

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
