ProxyPass "/__vlt_metrika/" "!"
Alias "/__vlt_metrika/" "/var/www/vlt-metrika/"

<Directory "/var/www/vlt-metrika/">
    Require all granted
</Directory>

# Keep invitations out of analytics, including their private URL fragments.
# mod_substitute needs an uncompressed upstream response.
RequestHeader unset Accept-Encoding
<LocationMatch "^/(?!((en|ru)/)?join/?$)">
    AddOutputFilterByType SUBSTITUTE text/html
    Substitute "s|<head>|<head><script src=\"/__vlt_metrika/yandex-metrika.js?id=112808244\"></script>|ni"
</LocationMatch>
